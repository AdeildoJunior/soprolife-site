# M26.4/M26.5 — o CORPO do único vhost público da VPS.
#
# Ele publica um processo (127.0.0.1:8016) e seis caminhos. Não existe aqui
# `location /` genérico que sirva algo, não existe proxy para a 8015 (a API
# do Command Center) nem para a 8765 (o painel estático). Um `location` a
# mais neste arquivo é uma decisão de expor algo — e é para isso que ele é
# curto o bastante para ser lido inteiro numa revisão.
#
# ## Este arquivo NÃO é o que fica instalado (M26.5)
#
# Ele é a FONTE. Quem monta o arquivo de
# /etc/nginx/sites-available/resultados-api.soprolife.com.br é
# `nucleo-m15/scripts/nginx_portal_vhost.py`, chamado por
# `deploy-portal-resultados.sh nginx`. O renderizador pega o `server { … }`
# daqui, o replica no destino certo (porta 80 antes do TLS, porta 443
# depois) e acrescenta o que não cabe numa fonte versionada:
#
#   * os caminhos do certificado, LIDOS do arquivo que já está instalado ou
#     de /etc/letsencrypt/live/ — de modo que reconstruir o vhost nunca
#     derruba o HTTPS, e o vhost deixa de ser um arquivo que só o certbot
#     sabe reproduzir;
#   * o bloco de redirecionamento 80 → 443, com `server_tokens off` (o que o
#     certbot gera não tem, e vazava `nginx/1.24.0 (Ubuntu)`);
#   * os blocos `default_server` de 80 e 443. Sem eles, o vhost do portal é
#     o primeiro a escutar essas portas e vira, por omissão do nginx, o
#     servidor padrão — respondendo a QUALQUER `Host` e a qualquer SNI que
#     aponte para este IP. O catch-all explícito devolve 444 na 80 e
#     `ssl_reject_handshake on` na 443, e o portal passa a atender
#     exclusivamente o próprio nome;
#   * os ENDEREÇOS da escuta na 443, relidos do vhost instalado. Eles não
#     ficam aqui porque não são dado de repositório: dependem do IP que a
#     VPS tem. E são explícitos — nunca `listen 443 ssl` — porque nesta
#     máquina o `tailscaled` escuta a 443 do endereço do tailnet, servindo
#     o painel privado por `tailscale serve`. Um curinga disputaria essa
#     porta com ele: ou o nginx não sobe, ou o painel sai do ar. O
#     renderizador se recusa a emitir curinga na 443.
#
# Este arquivo continua sendo nginx válido e legível por si só; ele
# simplesmente não é instalado diretamente.

limit_req_zone $binary_remote_addr zone=portal_resultados:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=portal_conexoes:10m;

server {
    listen 80;
    listen [::]:80;
    server_name resultados-api.soprolife.com.br;

    # ------------------------------------------------------------------
    # CABEÇALHOS DE SEGURANÇA — no nível do SERVER, de propósito (M26.5).
    #
    # No nginx, `add_header` num `location` NÃO soma aos do server: ele
    # SUBSTITUI o conjunto inteiro. Declarar aqui, e em nenhum `location`,
    # é o que faz estes cabeçalhos valerem também para as respostas que o
    # próprio nginx inventa e que nunca chegam à aplicação:
    #
    #   * o 404 do catch-all (medido em produção saindo só com HSTS);
    #   * o 429 do `limit_req`;
    #   * o 413 do `client_max_body_size`;
    #   * o 502/504 quando o portal está fora do ar.
    #
    # Estes valores são os MESMOS de `app/portal/security.py`
    # (CABECALHOS_SEGUROS), e um teste falha se os dois divergirem. A
    # aplicação continua emitindo os dela — ela precisa estar correta
    # sozinha, para quem chega por loopback — e os `proxy_hide_header` das
    # rotas proxiadas descartam essa cópia, para que saia exatamente uma.
    # ------------------------------------------------------------------
    add_header Cache-Control "no-store, private, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    add_header Cross-Origin-Resource-Policy "same-site" always;

    # HSTS só neste subdomínio, e sem includeSubDomains: o domínio-mãe é
    # servido pelo GitHub Pages e não é nosso para pré-carregar. Em texto
    # claro (o estado pré-TLS) o navegador ignora este cabeçalho; ele vale a
    # partir do momento em que o renderizador emite este bloco na 443.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # O corpo de uma requisição do portal é um JSON com token e data. Não
    # existe upload aqui; 8 KiB é folga generosa.
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # PII e token nunca entram em log. O token viaja no fragmento e não
    # chega ao servidor, mas o caminho do documento e o cookie chegariam —
    # e um access log é backup, rotação e, um dia, um tíquete de suporte.
    access_log off;
    error_log /var/log/nginx/resultados-api.error.log warn;

    # Nada de identificar versão de software para quem estiver varrendo.
    server_tokens off;

    limit_conn portal_conexoes 10;

    # O desafio do Let's Encrypt, único caminho que precisa responder em
    # texto claro mesmo depois do TLS (renovação por HTTP-01). O
    # renderizador mantém uma cópia dele no bloco da porta 80.
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /p/v1/health {
        proxy_pass http://127.0.0.1:8016;
        include /etc/nginx/proxy_params;

        # A aplicação manda o mesmo conjunto de cabeçalhos; descartar a
        # cópia dela é o que evita `X-Frame-Options: DENY` duas vezes na
        # mesma resposta. Quem os emite na borda é o bloco `server`.
        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    location /p/v1/ {
        limit_req zone=portal_resultados burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8016;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        # PDF pode passar de alguns MiB; sem buffering o download começa
        # antes de o nginx ter o arquivo inteiro em disco temporário.
        proxy_buffering off;

        proxy_hide_header Cache-Control;
        proxy_hide_header Pragma;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header X-Robots-Tag;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
    }

    # Qualquer outra coisa: 404 seco, sem corpo, sem pista — e COM os
    # cabeçalhos do server, porque este `location` não declara nenhum.
    location / {
        return 404;
    }
}
