# M26.4 — o ÚNICO vhost público da VPS.
#
# Ele publica um processo (127.0.0.1:8016) e seis caminhos. Não existe aqui
# `location /` genérico, não existe proxy para a 8015 (a API do Command
# Center) nem para a 8765 (o painel estático). Um `location` a mais neste
# arquivo é uma decisão de expor algo — e é para isso que ele é curto o
# bastante para ser lido inteiro numa revisão.
#
# ## Por que só a porta 80 aqui
#
# Este arquivo é o estado PRÉ-TLS, e é assim de propósito. Um bloco `listen
# 443 ssl` com `ssl_certificate` comentado não passa no `nginx -t` ("no
# ssl_certificate is defined for the listen ... ssl directive"), e o certbot
# precisa de uma configuração válida para trabalhar. O certbot `--nginx`
# então faz a promoção no lugar: acrescenta a este mesmo bloco o `listen 443
# ssl` e os caminhos do certificado — preservando cada `location`, cada
# limite e cada cabeçalho daqui — e cria um bloco novo, pequeno, só para o
# redirecionamento de 80 para 443.
#
# Depois disso o arquivo instalado em /etc/nginx/sites-available DIVERGE
# deste, e é o certbot quem passa a mantê-lo (inclusive na renovação). Por
# isso `deploy-portal-resultados.sh nginx` se recusa a sobrescrever um vhost
# que já tem certificado: reinstalar este arquivo por cima derrubaria o
# HTTPS.
#
# Instalação: /etc/nginx/sites-available/resultados-api.soprolife.com.br

limit_req_zone $binary_remote_addr zone=portal_resultados:10m rate=30r/m;
limit_conn_zone $binary_remote_addr zone=portal_conexoes:10m;

server {
    listen 80;
    listen [::]:80;
    server_name resultados-api.soprolife.com.br;

    # HSTS só neste subdomínio, e sem includeSubDomains: o domínio-mãe é
    # servido pelo GitHub Pages e não é nosso para pré-carregar. Em texto
    # claro o navegador ignora este cabeçalho; ele passa a valer quando o
    # certbot promove este bloco para 443.
    add_header Strict-Transport-Security "max-age=15552000" always;

    # O corpo de uma requisição do portal é um JSON com token e data. Não
    # existe upload aqui; 8 KiB é folga generosa.
    client_max_body_size 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;

    # PII e token nunca entram em log. O token viaja no fragmento e não
    # chega ao servidor, mas o caminho do documento e o cookie chegariam —
    # e um access log é backup, rotação e, um dia, um tíquete de suporte.
    access_log off;
    error_log /var/log/nginx/resultados-api.error.log warn;

    # Nada de identificar versão de software para quem estiver varrendo.
    server_tokens off;

    limit_conn portal_conexoes 10;

    # O desafio do Let's Encrypt, único caminho que precisa responder em
    # texto claro mesmo depois do TLS (renovação por HTTP-01).
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location = /p/v1/health {
        proxy_pass http://127.0.0.1:8016;
        include /etc/nginx/proxy_params;
    }

    location /p/v1/ {
        limit_req zone=portal_resultados burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8016;
        include /etc/nginx/proxy_params;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        # PDF pode passar de alguns MiB; sem buffering o download começa
        # antes de o nginx ter o arquivo inteiro em disco temporário.
        proxy_buffering off;
    }

    # Qualquer outra coisa: 404 seco, sem corpo, sem pista.
    location / {
        return 404;
    }
}
