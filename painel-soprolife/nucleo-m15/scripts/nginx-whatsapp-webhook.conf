# Future activation only: include INSIDE the approved existing public HTTPS
# server block. Do not expose /integrations/* or the private panel/API broadly.
location = /api/v1/integrations/whatsapp/webhook {
    limit_except GET POST { deny all; }
    client_max_body_size 256k;
    client_body_timeout 5s;
    # GET contains a verify token. Never log its request line, even on error.
    access_log off;
    error_log /dev/null;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_send_timeout 10s;
    proxy_pass http://127.0.0.1:8015/api/v1/integrations/whatsapp/webhook;
    proxy_set_header Host $host;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-Request-ID "";
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
}
